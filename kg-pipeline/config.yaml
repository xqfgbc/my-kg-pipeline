# ============================================================
# 知识图谱管道配置文件
# ============================================================

# 知识库根目录（Obsidian vault 路径）
# ⚠️ 本地路径请在 config.local.yaml 中设置，不要修改此文件
# 优先级: 环境变量 KG_VAULT_PATH > config.local.yaml > 此默认值
vault_path: ""

# 回写 .md 文件时是否创建备份 (.bak 文件)
create_backup: true

# === wiki-link 自动注入阈值 ===
# Jaccard 相似度 >= auto_inject_threshold → 自动注入 [[wiki-links]]
auto_inject_threshold: 0.5
# Jaccard 相似度 >= suggest_threshold → 仅建议人工审核（记录在 review 列表中）
suggest_threshold: 0.3

# === 排除模式 ===
# 扫描时跳过的目录（相对路径前缀）
exclude_dirs:
  - ".obsidian"

# 扫描时跳过的文件模式（glob）
exclude_patterns:
  - "**/asset/**"

# === 实体别名映射 ===
# ⚠️ 别名已迁移到 config.aliases.local.yaml（本地文件，不提交到 Git）
# 复制 config.local.yaml.example 中的示例进行配置
# 管道运行时自动发现的别名也会追加到 config.aliases.local.yaml
