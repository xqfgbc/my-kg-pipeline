# ============================================================
# 知识图谱管道配置文件
# ============================================================

# 知识库根目录（Obsidian vault 路径）
# ⚠️ 本地路径请在 config.local.yaml 中设置，不要修改此文件
# 优先级: 环境变量 KG_VAULT_PATH > config.local.yaml > 此默认值
vault_path: ""

# 回写 .md 文件时是否创建备份 (.bak 文件)
create_backup: true

# === wiki-link 自动注入阈值 ===
# Jaccard 相似度 >= auto_inject_threshold → 自动注入 [[wiki-links]]
auto_inject_threshold: 0.5
# Jaccard 相似度 >= suggest_threshold → 仅建议人工审核（记录在 review 列表中）
suggest_threshold: 0.3

# === 排除模式 ===
# 扫描时跳过的目录（相对路径前缀）
exclude_dirs:
  - ".obsidian"

# 扫描时跳过的文件模式（glob）
exclude_patterns:
  - "**/asset/**"

# === 禁止写入文档 tags 的词 ===
# 回写 enriched frontmatter 时，从图谱实体派生出的标签会先按此表过滤。
#
# 为什么需要：管道会把文档正文里出现的词抽成实体，再作为标签回写进 frontmatter。
# 于是「封面」「目录」「附录」「分隔页」这类结构性词汇、以及公司/品牌名，
# 会从正文（如 "About Accenture" 章节、页脚）渗进 tags 并沉淀下来。
# 上游 ppt-extract 明令这些词不得作为标签，但**回写发生在上游之后**，
# 只在上游过滤挡不住 —— 实测某次批量入库后，7 篇文档的 tags 里都有这类词。
# 匹配方式为**包含**（不区分大小写）：标签里只要出现下列任一子串就被剔除。
# 用包含而非精确匹配，是因为这类词会组合出现 —— 例如正文里的 "About Accenture"
# 会被抽成 `Accenture内部`、结构页会被抽成 `章节分隔页`，精确匹配拦不住。
exclude_tags:
  - 埃森哲
  - Accenture
  - 目录
  - 分隔页
  - 封面
  - 附录
  - 占位页
  # 版式/结构类标签。实测它们在旧图里是度最高的节点
  # （导航 1593、章节结构 1500、章节页 1193、KPI矩阵 1354），与知识内容无关。
  # ⚠️ 不要改用「篇内 >50% 页面」这类统计规则：实测一次都命中不了
  #   （导航只占 0–17% 的页面），而且它们的文档频率比 Observability 还低，
  #   任何 DF/IDF 规则都会先误杀真概念。
  - 导航
  - 章节          # 覆盖 章节结构/章节页/章节索引/章节分隔/章节入口/章节导览…
  - 标题页
  - 样例页
  - 模板          # 覆盖 模板页/文档模板/模板说明/Excel模板
  - 阅读          # 阅读顺序/阅读路径/阅读建议/延伸阅读
  - 占位          # 占位页/占位符
  - 空白表格

# === 实体别名映射 ===
# ⚠️ 别名已迁移到 config.aliases.local.yaml（本地文件，不提交到 Git）
# 复制 config.local.yaml.example 中的示例进行配置
# 管道运行时自动发现的别名也会追加到 config.aliases.local.yaml
